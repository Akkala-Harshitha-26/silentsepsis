services:
  api:
    build: .
    container_name: silentsepsis-api
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/silentsepsis
      REDIS_URL: redis://redis:6379/0

  db:
    image: postgres:16
    container_name: silentsepsis-db
    environment:
      POSTGRES_DB: silentsepsis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: silentsepsis-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
